version: "3.9"

name: nesgesfinancetrust

services:
  # --------------------------------------------------------------------------
  # Backend Node.js / Express — indexador de bloques, API REST y WebSocket
  # --------------------------------------------------------------------------
  nesgesfinance-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nesges-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=mysql
      - REDIS_HOST=redis
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nesges-net

  # --------------------------------------------------------------------------
  # Frontend estático servido por Nginx (dashboards, explorador, marketplace)
  # --------------------------------------------------------------------------
  nesgesfinance-frontend:
    image: nginx:1.27-alpine
    container_name: nesges-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - nesgesfinance-backend
    networks:
      - nesges-net

  # --------------------------------------------------------------------------
  # Base de datos relacional MariaDB
  # --------------------------------------------------------------------------
  mysql:
    image: mariadb:10.11
    container_name: nesges-mysql
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=${DATABASE_NAME:-nesgesfinance}
      - MARIADB_USER=${DATABASE_USERNAME:-nesges}
      - MARIADB_PASSWORD=${DATABASE_PASSWORD:-cambie_esta_clave}
      - MARIADB_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD:-cambie_root}
    volumes:
      - nesges-mysql-data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nesges-net

  # --------------------------------------------------------------------------
  # Redis 7 con persistencia AOF (caché de bloques, mempool y summaries)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nesges-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - nesges-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - nesges-net

  # --------------------------------------------------------------------------
  # Reverse proxy Nginx con terminación SSL
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nesges-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nesgesfinance-backend
      - nesgesfinance-frontend
    networks:
      - nesges-net

  # --------------------------------------------------------------------------
  # Nodo Bitcoin Core 27.0 (DESHABILITADO por defecto — descomentar para uso
  # local con nodo propio). Requiere ~700 GB de disco para la cadena completa.
  # --------------------------------------------------------------------------
  # bitcoin-node:
  #   image: bitcoin/bitcoin:27.0
  #   container_name: nesges-bitcoind
  #   restart: unless-stopped
  #   command:
  #     - -server=1
  #     - -txindex=1
  #     - -coinstatsindex=1
  #     - -rpcbind=0.0.0.0
  #     - -rpcallowip=0.0.0.0/0
  #     - -rpcuser=${CORE_RPC_USERNAME}
  #     - -rpcpassword=${CORE_RPC_PASSWORD}
  #   volumes:
  #     - nesges-bitcoin-data:/home/bitcoin/.bitcoin
  #   ports:
  #     - "8332:8332"
  #     - "8333:8333"
  #   networks:
  #     - nesges-net

volumes:
  nesges-mysql-data:
  nesges-redis-data:
  # nesges-bitcoin-data:

networks:
  nesges-net:
    driver: bridge
