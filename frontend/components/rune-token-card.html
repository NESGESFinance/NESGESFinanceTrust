<article class="rune-card" data-rune-id="{{rune_id}}">
  <div class="cabecera">
    <span class="simbolo">{{symbol}}</span>
    <h3>{{spaced_name}}</h3>
  </div>
  <div class="cuerpo">
    <div class="metricas">
      <span>ID</span><span>{{rune_id}}</span>
      <span>Suministro</span><span>{{supply}}</span>
      <span>Divisibilidad</span><span>{{divisibility}}</span>
      <span>Titulares</span><span>{{holders}}</span>
      <span>Bloque de génesis</span><span>{{genesis_block}}</span>
    </div>
  </div>
</article>
