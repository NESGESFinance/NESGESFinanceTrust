<article class="rwa-card" data-asset-id="{{id}}">
  <div class="cabecera">
    <span class="etiqueta">{{type}}</span>
    <h3>{{name}}</h3>
  </div>
  <div class="cuerpo">
    <div class="valoracion">{{valuationUSD}}</div>
    <p>{{description}}</p>
    <p class="meta"><strong>Estado:</strong> {{status}}</p>
    <p class="meta"><strong>Ordinal:</strong> {{inscriptionId}}</p>
    <p class="meta"><strong>Titular:</strong> {{owner}}</p>
  </div>
</article>
