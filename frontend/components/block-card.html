<div class="bloque tarjeta" data-height="{{height}}">
  <div class="cabecera">#{{height}}</div>
  <div class="cuerpo">
    <p><strong>Hash:</strong> {{hash}}</p>
    <p><strong>Transacciones:</strong> {{tx_count}}</p>
    <p><strong>Tamaño:</strong> {{size}}</p>
    <p><strong>Comisiones:</strong> {{total_fees}} sat</p>
    <p><strong>Fecha:</strong> {{timestamp}}</p>
  </div>
</div>
